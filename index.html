<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculadora de sueldo líquido para Chile: AFP, salud, seguro de cesantía e impuesto único de segunda categoría, con UF y UTM actualizadas automáticamente."
    />
    <title>Calculadora de sueldo líquido · Chile</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E$%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Aplica el tema guardado antes de pintar, para evitar el parpadeo.
      try {
        var t = localStorage.getItem('tema')
        var oscuro = t ? t === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
